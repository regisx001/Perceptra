name: Frontend CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'web/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'web/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  check-and-build:
    name: Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
