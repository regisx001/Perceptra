name: Backend CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Test & Verify Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify database migrations
        run: |
          uv run flask --app "src.app:create_app" db upgrade
          uv run flask --app "src.app:create_app" db check

      - name: Run backend tests
        run: uv run pytest
