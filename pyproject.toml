[project]
name = "perceptra"
version = "0.1.0"
description = "Content-Based Image Retrieval (CBIR) with Feature Relevance Estimation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-bcrypt>=1.0.1",
    "flask-cors>=6.0.5",
    "flask-jwt-extended>=4.7.4",
    "flask-migrate>=4.1.0",
    "flask-restful>=0.3.10",
    "flask-sqlalchemy>=3.1.1",
    "fsspec>=2026.9.0",
    "gunicorn>=26.2.0",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
perceptra = "src.cli:cli"
start = "src.cli:serve"
dev = "src.cli:dev"
db-upgrade = "src.cli:db_upgrade"
db-migrate = "src.cli:db_migrate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

